<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入系統 - KOL 網球管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 border border-slate-100 relative">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-lg shadow-blue-500/30 mb-3">
                🎾
            </div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">KOL 網球排課系統</h1>
            <p class="text-xs text-slate-500 mt-1">學員專屬課表・教練排班・請假審核</p>
        </div>

        <!-- LINE 快速登入專用按鈕 (學員主要入口) -->
        <div class="mb-6 space-y-2">
            <button type="button" id="lineLoginBtn" onclick="handleLineLogin()" class="w-full py-3 px-4 bg-[#06C755] hover:bg-[#05b34c] active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-md shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.019 9.587.39.084.922.256 1.057.587.121.298.08.766.039 1.066l-.168 1.015c-.052.31-.242 1.213 1.064.662 1.306-.552 7.042-4.148 9.605-7.103 1.633-1.815 2.384-3.666 2.384-5.814z"/>
                </svg>
                <span>使用 LINE 一鍵快速登入</span>
            </button>
            <p class="text-[11px] text-center text-slate-400">學員可直接透過 LINE 綁定手機，免記密碼</p>
        </div>

        <div class="relative flex items-center justify-center mb-6">
            <div class="border-t border-slate-200 w-full"></div>
            <span class="bg-white px-3 text-[11px] text-slate-400 font-medium uppercase absolute">或使用帳號密碼</span>
        </div>

        <!-- 傳統帳密登入表單 (小編、教練、管理者) -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">帳號 / 手機號碼</label>
                <input type="text" id="identifier" name="identifier" required placeholder="請輸入帳號或手機" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
            </div>

            <div id="errorMessage" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-600 font-medium"></div>

            <button type="submit" id="submitBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-md transition-all flex items-center justify-center">
                帳密登入
            </button>
        </form>
    </div>

    <!-- Modal: LINE 首次學員手機綁定 -->
    <div id="lineBindModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/70 p-4">
        <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-6 space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-xl mx-auto mb-2">
                    🔗
                </div>
                <h3 class="text-base font-bold text-slate-800">首次 LINE 學員身份綁定</h3>
                <p class="text-xs text-slate-500 mt-1">請輸入您報名時填寫的聯絡手機，即可將此 LINE 帳號與您的課表永久綁定！</p>
            </div>

            <form id="lineBindForm" class="space-y-3">
                <input type="hidden" id="bindLineUserId">
                <input type="hidden" id="bindLineDisplayName">

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">聯絡電話 (手機號碼)</label>
                    <input type="text" id="bindPhone" placeholder="例如: 0981034534" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">學員姓名 (選填核對)</label>
                    <input type="text" id="bindStudentName" placeholder="例如: 譚詠𣌀 (Winky)" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
                </div>

                <div id="bindError" class="hidden p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-xs text-rose-600 font-medium"></div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeLineBindModal()" class="w-1/3 py-2 text-xs font-medium text-slate-600 bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" id="bindSubmitBtn" class="w-2/3 py-2 text-xs font-bold text-white bg-[#06C755] hover:bg-[#05b34c] rounded-lg shadow-xs transition-colors">確認綁定並登入</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const LIFF_ID = '2011132056-28GhLpgi';

        document.addEventListener('DOMContentLoaded', async () => {
            // 初始化 LINE LIFF
            try {
                if (window.liff) {
                    await liff.init({ liffId: LIFF_ID });
                    // 如果是在 LINE 內建瀏覽器開啟且已登入 LINE
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        await checkAndLoginLine(profile.userId, profile.displayName);
                    }
                }
            } catch (err) {
                console.warn('LIFF init warning:', err);
            }
        });

        // 點擊「使用 LINE 快速登入」
        async function handleLineLogin() {
            const btn = document.getElementById('lineLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> 連線 LINE 中...';

            try {
                if (!window.liff) throw new Error('LINE SDK 載入失敗');
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                await checkAndLoginLine(profile.userId, profile.displayName);
            } catch (err) {
                alert('LINE 登入發生錯誤：' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<span>使用 LINE 一鍵快速登入</span>';
            }
        }

        // 向後端確認該 LINE ID 是否已綁定學生
        async function checkAndLoginLine(lineUserId, displayName) {
            try {
                const res = await fetch('/api/auth/line-liff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        line_user_id: lineUserId,
                        display_name: displayName
                    })
                });
                const data = await res.json();

                if (data.is_bound) {
                    // 已綁定，直接登入
                    localStorage.setItem('kol_token', data.token);
                    localStorage.setItem('kol_user', JSON.stringify(data.user));
                    window.location.href = (data.user.role === 'student') ? '/student/portal' : '/calendar';
                } else {
                    // 尚未綁定，開啟綁定視窗
                    document.getElementById('bindLineUserId').value = lineUserId;
                    document.getElementById('bindLineDisplayName').value = displayName;
                    openLineBindModal();
                }
            } catch (e) {
                alert('伺服器驗證失敗：' + e.message);
            }
        }

        function openLineBindModal() {
            document.getElementById('lineBindModal').classList.remove('hidden');
            document.getElementById('lineBindModal').classList.add('flex');
        }

        function closeLineBindModal() {
            document.getElementById('lineBindModal').classList.add('hidden');
            document.getElementById('lineBindModal').classList.remove('flex');
            const btn = document.getElementById('lineLoginBtn');
            btn.disabled = false;
            btn.innerHTML = '<span>使用 LINE 一鍵快速登入</span>';
        }

        // 提交手機綁定表單
        document.getElementById('lineBindForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('bindPhone').value.trim();
            const studentName = document.getElementById('bindStudentName').value.trim();
            const lineUserId = document.getElementById('bindLineUserId').value;
            const lineDisplayName = document.getElementById('bindLineDisplayName').value;
            const errBox = document.getElementById('bindError');
            const btn = document.getElementById('bindSubmitBtn');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = '綁定驗證中...';

            try {
                const res = await fetch('/api/auth/line-bind', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        line_user_id: lineUserId,
                        line_display_name: lineDisplayName,
                        phone: phone,
                        student_name: studentName
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '綁定失敗');

                alert(data.message);
                localStorage.setItem('kol_token', data.token);
                localStorage.setItem('kol_user', JSON.stringify(data.user));
                window.location.href = '/student/portal';
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '確認綁定並登入';
            }
        });

        // 帳密登入提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '登入中...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '登入失敗');

                localStorage.setItem('kol_token', data.token);
                localStorage.setItem('kol_user', JSON.stringify(data.user));

                if (data.user.role === 'student') {
                    window.location.href = '/student/portal';
                } else {
                    window.location.href = '/calendar';
                }
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '帳密登入';
            }
        });
    </script>
</body>
</html>
