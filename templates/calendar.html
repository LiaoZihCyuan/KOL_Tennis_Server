<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOL 網球管理系統 - 專業課表看板</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.15/index.global.min.js'></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>

    <link rel="stylesheet" href="/static/assets/css/calendar.css">
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">

    <aside class="bg-white border-r border-slate-200 flex flex-col shadow-xl">
        <div class="p-6 border-b border-slate-100 bg-slate-900 text-white">
            <h1 class="text-xl font-bold flex items-center">
                <span class="mr-2">🎾</span> KOL 網球管理
            </h1>
        </div>
        
        <div class="p-6 flex-1 overflow-y-auto">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">快速跳轉日期</h2>
            <div id="mini-calendar-container" class="bg-slate-50 rounded-2xl p-2 mb-8 border border-slate-100">
                <input type="text" id="mini-calendar" class="hidden">
            </div>
            
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">狀態說明</h2>
            <div class="space-y-3">
                <div class="flex items-center text-sm font-medium text-slate-600">
                    <span class="w-3 h-3 rounded-full bg-blue-500 mr-3 shadow-sm"></span> 個人班 (Private)
                </div>
                <div class="flex items-center text-sm font-medium text-slate-600">
                    <span class="w-3 h-3 rounded-full bg-purple-500 mr-3 shadow-sm"></span> 團體班 (Group)
                </div>
                <div class="flex items-center text-sm font-medium text-slate-600">
                    <span class="w-3 h-3 rounded-full bg-rose-500 mr-3 shadow-sm"></span> 學員請假 (Excused)
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm z-10">
            <div class="flex items-center gap-4">
                <span class="text-slate-800 font-bold text-lg">週排課總覽看板</span>
                <nav class="flex text-xs text-slate-400">
                    <span>管理後台</span>
                    <span class="mx-2">/</span>
                    <span class="text-slate-600 font-medium">排課系統</span>
                </nav>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="flex bg-slate-100 rounded-lg p-1 mr-4">
                    <button onclick="calendar.prev()" class="p-1.5 hover:bg-white hover:shadow-sm rounded-md transition-all text-slate-600">◀</button>
                    <button onclick="calendar.today()" class="px-4 py-1.5 hover:bg-white hover:shadow-sm rounded-md text-sm font-bold text-slate-700 transition-all">今天</button>
                    <button onclick="calendar.next()" class="p-1.5 hover:bg-white hover:shadow-sm rounded-md transition-all text-slate-600">▶</button>
                </div>
                <div class="text-right border-l pl-4 border-slate-200">
                    <div class="text-sm font-bold text-slate-700">管理者</div>
                    <div class="text-[10px] text-slate-400 uppercase tracking-tighter">System Administrator</div>
                </div>
            </div>
        </header>
        
        <div class="calendar-main-container p-4">
            <div id='calendar'></div>
        </div>
    </main>

    <!-- Course Modal -->
    <div id="courseModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50">
        <div class="bg-white rounded-xl shadow-2xl w-[400px] overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-lg">新增課程</h3>
                <button onclick="closeCourseModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <form id="courseForm" class="p-6 space-y-4">
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">日期</label>
                        <input type="date" id="courseDate" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required readonly>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">開始時間</label>
                        <input type="time" id="startTime" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">課程時間長度</label>
                    <select id="courseDuration" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        <option value="60">1 小時</option>
                        <option value="90">1.5 小時</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">學生 (姓名或關鍵字搜尋)</label>
                    <input type="text" id="studentName" placeholder="蔡長霖" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                </div>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">程度</label>
                        <select id="studentLevel" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                            <option value="初級">初級</option>
                            <option value="中級">中級</option>
                            <option value="高級">高級</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">教練</label>
                        <select id="coachName" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                            <option value="" disabled selected>請選擇教練</option>
                            <option value="蔡">蔡教練</option>
                            <option value="張">張教練</option>
                            <option value="湯">湯教練</option>
                            <option value="李">李教練</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-2">
                    <button type="button" id="cancelCourseBtn" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">取消</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">新增課程</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/assets/js/calendar.js"></script>
</body>
</html>
