# Reverse proxy in front of gunicorn (shared by docker-compose.yml and docker-compose.prod.yml).
# nginx reads each request completely before handing it to gunicorn, so malformed
# or slow clients get dropped here instead of tying up gunicorn's sync workers.
server {
    listen 80;
    server_name _;

    # Drop clients that connect but never finish sending the request.
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Re-resolve "api" through Docker's DNS so a recreated api container
    # (new IP after each deploy) does not leave nginx pointing at the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://api:5000;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
